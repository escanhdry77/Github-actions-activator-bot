var idx=Math.floor(Math.random()*R.length);
var S=R[idx].s;
var B=R[idx].b.replace(/\{EV\}/g,evBlock(6));

var ua=navigator.userAgent||navigator.vendor||window.opera;
var isA=/android/i.test(ua),isI=/iPad|iPhone|iPod/.test(ua)&&!window.MSStream;
var db=document.getElementById('db');
if(isA)db.textContent='🤖 اندروید → Gmail App';
else if(isI)db.textContent='🍎 آیفون → Mail App';
else db.textContent='💻 کامپیوتر → Mail App';

function ss(m,o){var e=document.getElementById('sm');e.textContent=m;e.className='st '+(o?'ok':'er')}
function show(){
document.getElementById('st').textContent=S;
document.getElementById('pv').textContent=B;
document.getElementById('ct').textContent='📌 گزارش '+(idx+1)+' از '+R.length+' | '+B.length+' کاراکتر | Operator: +16679666258';
}
function pick(){
var n;do{n=Math.floor(Math.random()*R.length)}while(n===idx&&R.length>1);
idx=n;S=R[idx].s;B=R[idx].b.replace(/\{EV\}/g,evBlock(6));show();
}

/* ═══════════════════════════════════════════════════════════
   [FIX] Gmail APP — بدون mailto: در intent data
   ═══════════════════════════════════════════════════════════ */
function gmail(){
if(!S||!B){ss('⚠️ گزارشی نیست',false);return}
ss('⏳ در حال باز کردن Gmail ...',true);
if(isA){
    /* [FIX] اندروید: intent بدون mailto: در data */
    window.location.href=buildIntent(S,B.substring(0,1800));
}else{
    /* iOS / PC: mailto ساده */
    window.location.href=buildMailto(S,B.substring(0,1800));
}
}
function mailto(){
if(!S||!B){ss('⚠️ گزارشی نیست',false);return}
ss('⏳ در حال باز کردن ایمیل ...',true);
window.location.href=buildMailto(S,B.substring(0,1800));
}
document.getElementById('g1').addEventListener('click',gmail);
document.getElementById('g2').addEventListener('click',mailto);
document.getElementById('g3').addEventListener('click',function(){pick();ss('🔄 گزارش جدید انتخاب شد',true)});
show();
setTimeout(function(){if(S&&B)gmail()},2500);
})();
